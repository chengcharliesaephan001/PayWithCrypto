<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crypto Demo Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f8fa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-box {
    width: 90%;
    max-width: 400px;
    background: white;
    padding: 30px;
    border-radius: 18px;
    border: 1px solid #e5e7eb;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 25px;
}

h1 {
    margin-bottom: 8px;
}

.subtitle {
    color: #6b7280;
}

.demo {
    background: #fff4cc;
    color: #8a6100;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    margin: 20px 0;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    border: none;
    border-radius: 8px;
    background: #111827;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">Crypto Demo</div>

    <h1>Welcome back</h1>

    <p class="subtitle">
        Sign in to your demo account.
    </p>

    <div class="demo">
        DEMO / TEST ACCOUNT
    </div>

    <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="off"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button onclick="login()">
        Sign in
    </button>

</div>

<script>
function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if (
        username === "CCSgiveaway" &&
        password === "CCS12345$$"
    ) {

        window.location.href = "index.html";

    } else {

        alert("Incorrect demo username or password.");

    }
}
</script>

</body>
</html>
